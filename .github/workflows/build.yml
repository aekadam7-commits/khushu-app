name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          echo "=== www contents ==="
          ls -la www/
          echo "=== www/js contents ==="
          ls -la www/js/
          echo "=== Check calendar.js ==="
          tail -5 www/js/calendar.js
          echo "=== Check if Calendar is defined ==="
          grep -n "const Calendar" www/js/calendar.js || echo "Calendar not found!"

      - name: Prepare assets folder
        run: |
          mkdir -p assets
          if [ -f icon.png ]; then
            cp icon.png assets/icon.png
            mkdir -p assets/splash
            cp icon.png assets/splash/splash.png
          fi
          ls -la assets/ || true

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        run: npx @capacitor/assets generate --android || echo "Asset generation skipped"

      - name: Sync web assets
        run: npx cap sync android

      - name: Verify files in android assets
        run: |
          echo "=== android/app/src/main/assets/public ==="
          ls -la android/app/src/main/assets/public/ || echo "public folder not found!"
          echo "=== android assets/js ==="
          ls -la android/app/src/main/assets/public/js/ || echo "js folder not found!"
          echo "=== Check calendar.js in android ==="
          tail -5 android/app/src/main/assets/public/js/calendar.js || echo "calendar.js NOT FOUND in android!"

      - name: Copy Adhan & Dua sounds to Android raw
        run: |
          RAW_DIR="android/app/src/main/res/raw"
          DRAWABLE_DIR="android/app/src/main/res/drawable"
          mkdir -p "$RAW_DIR"
          mkdir -p "$DRAWABLE_DIR"

          for sound in adhan1 adhan2 adhan_fajr dua_adhan; do
            if [ -f "sounds/${sound}.mp3" ]; then
              cp "sounds/${sound}.mp3" "$RAW_DIR/${sound}.mp3"
              echo "✓ ${sound}.mp3 copied"
            else
              echo "⚠️ sounds/${sound}.mp3 NOT FOUND"
            fi
          done

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khushu-apk
          path: android/app/build/outputs/apk/debug/*.apk
